[package]
name = "dredge"
version = "0.1.0"
edition = "2021"
description = "Read-only CLI that reports untracked or drifted dotfiles and secrets in a home directory"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["dotfiles", "secrets", "audit", "stow", "chezmoi"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dredge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
libc = "=0.2.191"
owo-colors = "4.4.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"

[dev-dependencies]
assert_cmd = "2"
insta = "1.49.0"
tempfile = "3"
