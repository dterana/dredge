# Secret detection rules. Patterns are linear-time (regex crate), no lookaround.
#
# `source` is "gitleaks" only for patterns that are a direct syntax conversion of a
# gitleaks default rule (see NOTICE-THIRD-PARTY.md). Every other pattern was written
# for dredge from the publicly documented shape of the token, and is "dredge".
# No entropy based rule is enabled; the generic rule below stays disabled.

[[rule]]
id = "private-key"
regex = '-----BEGIN [A-Z ]*PRIVATE KEY-----'
enabled = true
source = "dredge"

[[rule]]
id = "aws-access-key-id"
regex = '(?-u:\b)(?:AKIA|ASIA)[0-9A-Z]{16}(?-u:\b)'
enabled = true
source = "dredge"

[[rule]]
id = "aws-secret-access-key"
regex = '(?i)aws_?secret_?access_?key["\x27]?\s*[:=]\s*["\x27]?[A-Za-z0-9/+=]{40}(?:[^A-Za-z0-9/+=]|$)'
enabled = true
source = "dredge"

[[rule]]
id = "github-token"
regex = '(?-u:\b)gh[pousr]_[A-Za-z0-9]{36,}(?-u:\b)'
enabled = true
source = "dredge"

[[rule]]
id = "github-fine-grained-pat"
regex = 'github_pat_[A-Za-z0-9_]{82}'
enabled = true
source = "gitleaks"

[[rule]]
id = "gitlab-pat"
regex = 'glpat-[A-Za-z0-9_-]{20}'
enabled = true
source = "gitleaks"

[[rule]]
id = "slack-bot-token"
regex = 'xoxb-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*'
enabled = true
source = "gitleaks"

[[rule]]
id = "slack-user-token"
regex = 'xox[pe](?:-[0-9]{10,13}){3}-[a-zA-Z0-9-]{28,34}'
enabled = true
source = "gitleaks"

[[rule]]
id = "slack-app-token"
regex = '(?i)xapp-[0-9]-[A-Z0-9]+-[0-9]+-[a-z0-9]+'
enabled = true
source = "gitleaks"

[[rule]]
id = "slack-webhook-url"
regex = 'https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{24}'
enabled = true
source = "dredge"

[[rule]]
id = "stripe-live-key"
regex = '(?-u:\b)(?:sk|rk)_live_[A-Za-z0-9]{24,99}(?-u:\b)'
enabled = true
source = "dredge"

[[rule]]
id = "google-api-key"
regex = '(?-u:\b)AIza[A-Za-z0-9_-]{35}(?:[^A-Za-z0-9_-]|$)'
enabled = true
source = "dredge"

[[rule]]
id = "npm-access-token"
regex = '(?-u:\b)npm_[A-Za-z0-9]{36}(?-u:\b)'
enabled = true
source = "dredge"

[[rule]]
id = "pypi-upload-token"
regex = 'pypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,1000}'
enabled = true
source = "gitleaks"

[[rule]]
id = "sendgrid-api-key"
regex = '(?-u:\b)SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}(?:[^A-Za-z0-9_-]|$)'
enabled = true
source = "dredge"

[[rule]]
id = "twilio-api-key"
regex = '(?-u:\b)SK[0-9a-f]{32}(?-u:\b)'
enabled = true
source = "dredge"

[[rule]]
id = "shopify-access-token"
regex = 'shpat_[a-fA-F0-9]{32}'
enabled = true
source = "gitleaks"

[[rule]]
id = "openai-api-key"
regex = '(?-u:\b)sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,200}T3BlbkFJ[A-Za-z0-9_-]{20,200}'
enabled = true
source = "dredge"

[[rule]]
id = "anthropic-api-key"
regex = '(?-u:\b)sk-ant-api03-[A-Za-z0-9_-]{93}AA(?:[^A-Za-z0-9_-]|$)'
enabled = true
source = "dredge"

[[rule]]
id = "digitalocean-token"
regex = '(?-u:\b)dop_v1_[a-f0-9]{64}(?-u:\b)'
enabled = true
source = "dredge"

[[rule]]
id = "age-secret-key"
regex = '(?-u:\b)AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}(?-u:\b)'
enabled = true
source = "dredge"

[[rule]]
id = "ngrok-authtoken"
regex = '(?i)(?-u:\b)(?:ngrok_)?authtoken["\x27]?\s*[:=]\s*["\x27]?[A-Za-z0-9_]{20,}'
enabled = true
source = "dredge"

[[rule]]
id = "generic-secret-assignment"
regex = '(?i)(?:password|token)\s*[:=]\s*\S+'
enabled = false
source = "dredge"
