# Secret detection rules. Patterns are linear-time (regex crate), no lookaround.
# `source` names where the pattern was derived from.

[[rule]]
id = "private-key"
regex = '-----BEGIN [A-Z ]*PRIVATE KEY-----'
enabled = true
source = "gitleaks"

[[rule]]
id = "aws-access-key-id"
regex = '(?-u:\b)(?:AKIA|ASIA)[0-9A-Z]{16}(?-u:\b)'
enabled = true
source = "gitleaks"

[[rule]]
id = "github-token"
regex = '(?-u:\b)gh[pousr]_[A-Za-z0-9]{36,}(?-u:\b)'
enabled = true
source = "gitleaks"

[[rule]]
id = "ngrok-authtoken"
regex = '(?i)authtoken["\x27]?\s*[:=]\s*["\x27]?[A-Za-z0-9_]{20,}'
enabled = true
source = "dredge"

[[rule]]
id = "generic-secret-assignment"
regex = '(?i)(?:password|token)\s*[:=]\s*\S+'
enabled = false
source = "dredge"
