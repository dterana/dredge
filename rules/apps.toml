[[rule]]
app = "zsh"
kind = "config"
globs = [".zshrc", ".zshenv", ".zprofile", ".zlogin", ".zlogout", ".zsh/**"]
description = "Zsh shell configuration"

[[rule]]
app = "zsh"
kind = "state"
globs = [".zsh_history", ".zsh_sessions/**", ".zcompdump*"]
description = "Zsh history and session state"

[[rule]]
app = "bash"
kind = "config"
globs = [".bashrc", ".bash_profile", ".bash_login", ".bash_logout"]
description = "Bash shell configuration"

[[rule]]
app = "bash"
kind = "state"
globs = [".bash_history", ".bash_sessions/**"]
description = "Bash history and session state"

[[rule]]
app = "fish"
kind = "config"
globs = [".config/fish/**"]
description = "Fish shell configuration"

[[rule]]
app = "fish"
kind = "state"
globs = [".local/share/fish/**"]
description = "Fish history and data"

[[rule]]
app = "nushell"
kind = "config"
globs = [".config/nushell/**"]
description = "Nushell configuration"

[[rule]]
app = "git"
kind = "config"
globs = [".gitconfig", ".gitignore_global", ".config/git/**"]
description = "Git configuration"

[[rule]]
app = "gh"
kind = "config"
globs = [".config/gh/**"]
description = "GitHub CLI configuration and hosts"

[[rule]]
app = "glab"
kind = "config"
globs = [".config/glab-cli/**"]
description = "GitLab CLI configuration"

[[rule]]
app = "lazygit"
kind = "config"
globs = [".config/lazygit/**", "Library/Application Support/lazygit/**"]
description = "lazygit configuration"

[[rule]]
app = "neovim"
kind = "config"
globs = [".config/nvim/**"]
description = "Neovim configuration"

[[rule]]
app = "neovim"
kind = "state"
globs = [".local/share/nvim/**", ".local/state/nvim/**"]
description = "Neovim data and state"

[[rule]]
app = "vim"
kind = "config"
globs = [".vimrc", ".vim/**"]
description = "Vim configuration"

[[rule]]
app = "vim"
kind = "state"
globs = [".viminfo"]
description = "Vim session history"

[[rule]]
app = "vscode"
kind = "config"
globs = ["Library/Application Support/Code/User/settings.json", "Library/Application Support/Code/User/keybindings.json", "Library/Application Support/Code/User/snippets/**"]
description = "Visual Studio Code user settings, keybindings and snippets"

[[rule]]
app = "vscode"
kind = "cache"
globs = ["Library/Application Support/Code/Cache/**", "Library/Application Support/Code/CachedData/**", "Library/Application Support/Code/Crashpad/**", "Library/Application Support/Code/GPUCache/**", "Library/Application Support/Code/Service Worker/**"]
description = "Visual Studio Code caches"

[[rule]]
app = "vscode"
kind = "state"
globs = ["Library/Application Support/Code/logs/**", "Library/Application Support/Code/User/workspaceStorage/**", "Library/Application Support/Code/User/globalStorage/**"]
description = "Visual Studio Code logs and per-workspace state"

[[rule]]
app = "zed"
kind = "config"
globs = [".config/zed/**"]
description = "Zed editor configuration"

[[rule]]
app = "sublime-text"
kind = "config"
globs = ["Library/Application Support/Sublime Text/Packages/User/**"]
description = "Sublime Text user packages and settings"

[[rule]]
app = "ghostty"
kind = "config"
globs = [".config/ghostty/**", "Library/Application Support/com.mitchellh.ghostty/**"]
description = "Ghostty terminal configuration"

[[rule]]
app = "kitty"
kind = "config"
